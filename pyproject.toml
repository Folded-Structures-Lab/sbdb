[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbdb"
version = "0.1.3"
description = "Set-Based Database: A framework for generalised set-based structural design"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Yuyu Wang", email = "yuyu.wang@uq.edu.au"},
    {name = "Joe Gattas", email = "j.gattas@uq.edu.au"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
examples = [
    "steelas>=0.2.0",
]

[project.scripts]
sbdb-generate = "sbdb.cli:main"

[project.urls]
Homepage = "https://github.com/Folded-Structures-Lab/sbdb"
Repository = "https://github.com/Folded-Structures-Lab/sbdb"
Documentation = "https://github.com/Folded-Structures-Lab/sbdb#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
